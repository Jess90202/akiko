    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:116px}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer}button:active,[role=button]:active{transform:scale(.97);transition:transform 120ms ease-out}button:focus-visible,input:focus-visible{outline:3px solid var(--corn);outline-offset:3px}.app{max-width:600px;margin:0 auto;min-height:100svh;padding:0 18px 32px}.masthead{padding:30px 2px 22px}.brand{font:600 clamp(37px,10vw,52px)/.98 var(--font-title);letter-spacing:-.04em;margin:0}.brand span{color:var(--terra)}.masthead p{margin:8px 0 0;color:var(--muted);font-size:14px}.ownerbar{display:none;position:sticky;top:0;z-index:8;margin:0 -18px;padding:10px 18px;background:var(--ink);color:var(--paper);align-items:center;justify-content:space-between;font-size:13px;font-weight:700}.ownerbar.show{display:flex}.ownerbar button{border:0;background:transparent;color:inherit;font-weight:800;padding:5px 0}.category-nav{position:sticky;top:0;z-index:6;margin:0 -18px;padding:9px 12px;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.ownerbar.show+.category-nav{top:42px}.category-nav::-webkit-scrollbar{display:none}.chips{display:flex;width:max-content;gap:5px}.chip{border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:750;white-space:nowrap}.chip.active{background:var(--ink);color:var(--paper)}.category{padding:24px 0 0;scroll-margin-top:112px}.ownerbar.show~.menu .category{scroll-margin-top:150px}.category[hidden],.dish-card[hidden]{display:none}.category-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}.category-title h2{font:600 29px/1.05 v argin:0 0 8px}.dialog p{margin:0 0 16px;color:var(--muted);font-size:14px}.dialog input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:12px 13px;font-size:18px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.dialog-actions button{border:1px solid var(--line);border-radius:999px;background:transparent;padding:9px 15px;font-weight:750}.dialog-actions .primary{background:var(--terra);border-color:var(--terra);color:#fff}.toast{position:fixed;z-index:30;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);padding:10px 13px 10px 16px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.25);font-size:13px;font-weight:700;white-space:nowrap;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.toast button{background:transparent;color:var(--corn);border:0;padding:5px;font-weight:850}.zoom{position:fixed;inset:0;z-index:40;background:rgba(8,6,5,.97);display:none;overflow:hidden;touch-action:none}.zoom.open{display:block}.zoom-image{position:fixed;object-fit:contain;transform-origin:top left;will-change:transform;user-select:none;-webkit-user-drag:none;touch-action:none}.zoom-close{position:absolute;z-index:2;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));width:44px;height:44px;border:1px solid #ffffff55;border-radius:50%;background:#17120fe8;color:#fff;font-size:27px;line-height:1}.zoom-hint{position:absolute;bottom:max(23px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff9;font-size:12px;pointer-events:none}.notice{font-size:12px;color:var(--terra);min-height:18px;margin:7px 0 0}.restore-button{border:1px solid #ffffff66;border-radius:999px;background:transparent;color:inherit;padding:6px 11px;font-size:12px;font-weight:750}
    @media(hover:hover) and (pointer:fine){.dish-photo:hover img{transform:scale(1.04);transition:transform 180ms ease-out}.chip:hover{color:var(--terra)}.menu-footer a:hover{text-decoration:underline}}
    @media(max-width:360px){.app{padding-inline:14px}.ownerbar,.category-nav{margin-inline:-14px;padding-inline:14px}.dish-card{grid-template-columns:72px minmax(0,1fr);gap:10px}.dish-photo{width:72px;height:72px}.owner-mode .dish-card{grid-template-columns:72px minmax(0,1fr)}.dish-copy h3{font-size:17px}.owner-controls{gap:5px}.price-input{width:88px}.remove-btn{padding:7px}}

    @media(prefers-color-scheme:dark){body{color:#2A211C}.category-nav{border-bottom-color:rgba(255,246,238,.2)}.dish-card{border-color:rgba(42,33,28,.12)}.dish-copy p{color:#625149}}
  </style>

<body>
<main class="app">
  <header class="masthead"><h1 class="brand">Brasa <span>&amp;</span> Maíz</h1><p>Cocina al fuego · Ciudad de México</p></header>
  <div class="ownerbar" id="ownerbar"><span>Modo dueño</span><span><button id="reset-menu" class="restore-button">Restablecer menú</button> <button id="exit-owner">Salir</button></span></div>
  <nav class="category-nav" aria-label="Categorías"><div class="chips" id="chips"></div></nav>
  <div class="menu" id="menu"></div>
  <footer class="menu-footer"><a href="https://akiko-tech.com/">Menú digital por Akiko Tech</a> · <a href="#admin" id="admin-link">Administrar</a></footer>
</main>
<div class="dialog-backdrop" id="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-copy"></p><div id="dialog-field"></div><p class="notice" id="dialog-notice" aria-live="polite"></p><div class="dialog-actions" id="dialog-actions"></div></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="undo" hidden>Deshacer</button></div>
<div class="zoom" id="zoom" aria-label="Imagen ampliada"><button class="zoom-close" id="zoom-close" aria-label="Cerrar imagen">×</button><img class="zoom-image" id="zoom-image" alt=""><div class="zoom-hint">Pellizca para ampliar · desliza para explorar</div></div>
<script>
(()=>{
  const original=[
    {id:'entradas',name:'Entradas',dishes:[
      ['Guacamole de molcajete','Aguacate tatemado, granada, cilantro y totopos de maíz azul.',148,'⭐ Favorito','https://plus.unsplash.com/premium_photo-1664472700331-78d01345b6d7?auto=format&fit=crop&fm=jpg&q=70&w=600'],['Queso fundido con huitlacoche','Quesillo dorado, huitlacoche de temporada y tortillas recién hechas.',185,'🌱 Vegetariano','photo-1547592180-85f173990554'],['Esquites de la casa','Elote asado, mayonesa de chile ancho, cotija y limón.',98,'🌶 Suave','photo-1551754655-cd27e38d2076'],['Tostada de atún al carbón','Atún sellado, aguacate, ponzu de chile serrano y ajonjolí.',196,'🌶 Picoso','photo-1512621776951-a57141f2eefd']]},
    {id:'tacos',name:'Tacos',dishes:[
      ['Costilla de res braseada','Diez horas al fuego, cebolla encurtida y salsa tatemada.',248,'⭐ Favorito','photo-1552332386-f8dd00dc2f85'],['Taco de camarón zarandeado','Camarón al carbón, col morada y crema de chipotle.',218,'🌶 Picoso','photo-1565299624946-b28f40a0ae38'],['Setas al pastor','Setas doradas en adobo de guajillo, piña y cilantro.',172,'🌱 Vegano','photo-1555939594-58d7cb561ad1'],['Carnitas de pato','Pato confitado, salsa verde cruda y chicharrón de la casa.',236,'⭐ Favorito','photo-1558030006-450675393462']]},
    {id:'fuertes',name:'Fuertes',dishes:[
      ['Pesca del día a la brasa','Pesca fresca, puré de coliflor tatemada y aceite de hierbas.',328,'🌶 Suave','photo-1519708227418-c8fd9a32b7a2'],['Pollo en mole de la abuela','Mole negro de 24 ingredientes, ajonjolí y arroz al vapor.',286,'⭐ Favorito','photo-1604908176997-125f25cc6f3d'],['Coliflor entera al carbón','Glaseada con miso de pepita, limón y hojas de temporada.',224,'🌱 Vegano','photo-1568584711075-3d021a7c3ca3'],['Arrachera marinada','Arrachera del norte, papas cambray y mantequilla de epazote.',348,'🌶 Suave','photo-1544025162-d76694265947']]},
    {id:'postres',name:'Postres',dishes:[
      ['Pastel tibio de elote','Helado de leche quemada y caramelo de piloncillo.',138,'⭐ Favorito','photo-1578985545062-69928b1d9587'],['Flan de cajeta','Cajeta de Celaya, sal de Colima y nuez tostada.',118,'','photo-1578985545062-69928b1d9587'],['Buñuelos con miel de guayaba','Crujientes, recién hechos y con miel especiada.',126,'🌱 Vegetariano','photo-1488477181946-6428a0291777'],['Nieve de temporada','Pregunta por el sabor que hicimos hoy.',88,'🌱 Vegano','photo-1497034825429-c343d7c6a68f']]},
    {id:'bebidas',name:'Bebidas',dishes:[
      ['Agua de jamaica y romero','Infusión de jamaica, limón amarillo y romero fresco.',68,'🌱 Vegano','photo-1544145945-f90425340c7e'],['Agua de horchata tostada','Arroz, canela de Ceilán y un toque de vainilla.',68,'','photo-1556679343-c7306c1976bc'],['Agua mineral con cítricos','Naranja, toronja y limón con burbujas.',72,'🌱 Vegano','photo-1600271886742-f049cd451bba'],['Limonada de chía','Limón real, chía hidratada y jarabe de agave.',64,'🌱 Vegano','photo-1621263764928-df1444c5e859']]}
  ];
  const clone=x=>JSON.parse(JSON.stringify(x)),key='brasa-menu-v2',imgURL=id=>id.startsWith('https://')?id:`https://images.unsplash.com/${id}?w=600&q=70`,money=n=>'$'+Number(n).toLocaleString('es-MX');
  let data=clone(original),owner=false,removed=null,toastTimer;
  try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length===original.length&&saved.every((c,i)=>c.id===original[i].id&&Array.isArray(c.dishes)))data=saved}catch{}
  // In production, menu edits would be saved to a server so every customer sees the changes.
  const menu=document.querySelector('#menu'),chips=document.querySelector('#chips'),ownerbar=document.querySelector('#ownerbar'),dialog=document.querySelector('#dialog-backdrop'),zoom=document.querySelector('#zoom'),zoomImg=document.querySelector('#zoom-image');
  const persist=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch{}};
  const toast=(message,undo=false)=>{document.querySelector('#toast-text').textContent=message;const button=document.querySelector('#undo');button.hidden=!undo;document.querySelector('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').classList.remove('show'),undo?5000:2600)};
  function render(){
    menu.innerHTML='';chips.innerHTML='';
    data.forEach(cat=>{if(!cat.dishes.length)return;const chip=document.createElement('button');chip.className='chip';chip.textContent=cat.name;chip.dataset.target=cat.id;chip.onclick=()=>document.getElementById(cat.id).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});chips.append(chip);
      const section=document.createElement('section');section.className='category';section.id=cat.id;section.innerHTML=`<div class="category-title"><h2>${cat.name}</h2><span>${cat.dishes.length} opciones</span></div><div class="dish-list"></div>`;const list=section.querySelector('.dish-list');
      cat.dishes.forEach((dish,index)=>{const card=document.createElement('article');card.className='dish-card';card.dataset.key=`${cat.id}-${index}`;card.innerHTML=`<button class="dish-photo" aria-label="Ampliar foto de ${dish[0]}"><img loading="lazy" src="${imgURL(dish[4])}" alt="${dish[0]}" onerror="this.style.opacity='.25'"></button><div class="dish-copy"><h3>${dish[0]}</h3><p>${dish[1]}</p><div class="dish-price">${money(dish[2])}</div><div class="owner-controls"><input class="price-input" type="number" inputmode="decimal" min="0.01" step="0.01" aria-label="Precio de ${dish[0]}" value="${dish[2]}"><button class="remove-btn">Eliminar</button></div></div>`;
        card.querySelector('.dish-photo').onclick=()=>openZoom(card.querySelector('img'));const input=card.querySelector('.price-input');input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur()}});input.addEventListener('blur',()=>{const value=Number(input.value);if(Number.isFinite(value)&&value>0){dish[2]=value;persist();card.querySelector('.dish-price').textContent=money(value);input.value=value}else{input.value=dish[2];toast('Escribe un precio mayor que cero.')}});card.querySelector('.remove-btn').onclick=()=>confirmDialog('Eliminar platillo',`¿Quieres quitar “${dish[0]}” del menú?`,()=>{removed={catId:cat.id,index,dish:clone(dish)};cat.dishes.splice(index,1);persist();render();toast('Platillo eliminado',true)},'Eliminar');list.append(card)
      });menu.append(section)
    });
    const first=chips.querySelector('.chip');if(first)first.classList.add('active');observeCategories()
  }
  let observer;function observeCategories(){if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{const e=entries.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(e)chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.target===e.target.id))},{rootMargin:'-125px 0px -65% 0px',threshold:0});menu.querySelectorAll('.category').forEach(s=>observer.observe(s))}
  function setOwner(value){owner=value;document.body.classList.toggle('owner-mode',value);ownerbar.classList.toggle('show',value);render();window.scrollTo(0,0)}
  function showDialog(title,copy,field,actions){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=copy;document.querySelector('#dialog-field').innerHTML=field;document.querySelector('#dialog-notice').textContent='';const row=document.querySelector('#dialog-actions');row.innerHTML='';actions.forEach(({label,run,primary=false})=>{const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=run;row.append(b)});dialog.classList.add('open')}
  function closeDialog(){dialog.classList.remove('open')}
  function confirmDialog(title,copy,run,actionLabel='Confirmar'){showDialog(title,copy,'',[{label:'Cancelar',run:closeDialog},{label:actionLabel,primary:true,run:()=>{closeDialog();run()} }])}
  document.querySelector('#admin-link').onclick=e=>{e.preventDefault();const field='<input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" aria-label="PIN">';showDialog('Administrar menú','PIN de demo: 1234',field,[{label:'Cancelar',run:closeDialog},{label:'Entrar',primary:true,run:()=>{if(document.querySelector('#pin').value==='1234'){closeDialog();setOwner(true)}else document.querySelector('#dialog-notice').textContent='PIN incorrecto. Intenta de nuevo.'}}]);setTimeout(()=>document.querySelector('#pin')?.focus(),0)};
  document.querySelector('#exit-owner').onclick=()=>setOwner(false);
  document.querySelector('#reset-menu').onclick=()=>confirmDialog('Restablecer menú','Se recuperarán los platillos y precios originales.',()=>{data=clone(original);removed=null;persist();render();toast('Menú restablecido')},'Restablecer');
  document.querySelector('#undo').onclick=()=>{if(!removed)return;const cat=data.find(c=>c.id===removed.catId);cat.dishes.splice(Math.min(removed.index,cat.dishes.length),0,removed.dish);removed=null;persist();render();document.querySelector('#toast').classList.remove('show')};
  dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();closeZoom()}});

  let sourceImg=null,sourceRect=null,base={left:0,top:0,width:0,height:0},scale=1,tx=0,ty=0,pointers=new Map(),gesture=null,lastTap=0,animating=false,closeRequested=false;
  function fitRect(img){const ratio=(img.naturalWidth||1)/(img.naturalHeight||1),w=Math.min(innerWidth,innerHeight*ratio),h=w/ratio;return{left:(innerWidth-w)/2,top:(innerHeight-h)/2,width:w,height:h}}
  function setZoomTransform(){zoomImg.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`}
  function openZoom(img){if(animating)return;closeRequested=false;sourceImg=img;sourceRect=img.getBoundingClientRect();zoomImg.src=img.src;zoomImg.alt=img.alt;zoom.classList.add('open');document.body.style.overflow='hidden';const end=fitRect(img);base=end;scale=1;tx=0;ty=0;zoomImg.style.transition='none';zoomImg.style.transformOrigin='top left';zoomImg.style.left=sourceRect.left+'px';zoomImg.style.top=sourceRect.top+'px';zoomImg.style.width=sourceRect.width+'px';zoomImg.style.height=sourceRect.height+'px';zoomImg.style.objectFit='cover';
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){zoomImg.style.left=end.left+'px';zoomImg.style.top=end.top+'px';zoomImg.style.width=end.width+'px';zoomImg.style.height=end.height+'px';zoomImg.style.objectFit='contain';zoomImg.style.transformOrigin='center';zoomImg.style.opacity='0';requestAnimationFrame(()=>zoomImg.style.opacity='1');return}
    animating=true;const sx=end.width/sourceRect.width,sy=end.height/sourceRect.height,dx=end.left-sourceRect.left,dy=end.top-sourceRect.top;requestAnimationFrame(()=>{zoomImg.style.transition='transform 250ms cubic-bezier(.23,1,.32,1)';zoomImg.style.transform=`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy})`;setTimeout(()=>{zoomImg.style.transition='none';zoomImg.style.transform='none';zoomImg.style.left=end.left+'px';zoomImg.style.top=end.top+'px';zoomImg.style.width=end.width+'px';zoomImg.style.height=end.height+'px';zoomImg.style.objectFit='contain';zoomImg.style.transformOrigin='center';animating=false;if(closeRequested){closeRequested=false;closeZoom()}},270)})
