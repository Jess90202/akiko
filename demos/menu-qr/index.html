      const section=document.createElement('section');section.className='category';section.id=cat.id;section.innerHTML=`<div class="category-title"><h2>${cat.name}</h2><span>${cat.dishes.length} opciones</span></div><div class="dish-list"></div>`;const list=section.querySelector('.dish-list');
      cat.dishes.forEach((dish,index)=>{const card=document.createElement('article');card.className='dish-card';card.dataset.key=`${cat.id}-${index}`;card.innerHTML=`<button class="dish-photo" aria-label="Ampliar foto de ${dish[0]}"><img loading="lazy" src="${imgURL(dish[4])}" alt="${dish[0]}" onerror="this.style.opacity='.25'"></button><div class="dish-copy"><h3>${dish[0]}</h3><p>${dish[1]}</p><div class="dish-price">${money(dish[2])}</div><div class="owner-controls"><input class="price-input" type="number" inputmode="decimal" min="0.01" step="0.01" aria-label="Precio de ${dish[0]}" value="${dish[2]}"><button class="remove-btn">Eliminar</button></div></div>`;
        card.querySelector('.dish-photo').onclick=()=>openZoom(card.querySelector('img'));const input=card.querySelector('.price-input');input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur()}});input.addEventListener('blur',()=>{const value=Number(input.value);if(Number.isFinite(value)&&value>0){dish[2]=value;persist();card.querySelector('.dish-price').textContent=money(value);input.value=value}else{input.value=dish[2];toast('Escribe un precio mayor que cero.')}});card.querySelector('.remove-btn').onclick=()=>confirmDialog('Eliminar platillo',`¿Quieres quitar “${dish[0]}” del menú?`,()=>{removed={catId:cat.id,index,dish:clone(dish)};cat.dishes.splice(index,1);persist();render();toast('Platillo eliminado',true)},'Eliminar');list.append(card)
      });menu.append(section)
    });
    const first=chips.querySelector('.chip');if(first)first.classList.add('active');observeCategories()
  }
  let observer;function observeCategories(){if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{const e=entries.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];if(e)chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.target===e.target.id))},{rootMargin:'-125px 0px -65% 0px',threshold:0});menu.querySelectorAll('.category').forEach(s=>observer.observe(s))}
  function setOwner(value){owner=value;document.body.classList.toggle('owner-mode',value);ownerbar.classList.toggle('show',value);render();window.scrollTo(0,0)}
  function showDialog(title,copy,field,actions){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=copy;document.querySelector('#dialog-field').innerHTML=field;document.querySelector('#dialog-notice').textContent='';const row=document.querySelector('#dialog-actions');row.innerHTML='';actions.forEach(({label,run,primary=false})=>{const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=run;row.append(b)});dialog.classList.add('open')}
  function closeDialog(){dialog.classList.remove('open')}
  function confirmDialog(title,copy,run,actionLabel='Confirmar'){showDialog(title,copy,'',[{label:'Cancelar',run:closeDialog},{label:actionLabel,primary:true,run:()=>{closeDialog();run()} }])}
  document.querySelector('#admin-link').onclick=e=>{e.preventDefault();const field='<input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" aria-label="PIN">';showDialog('Administrar menú','PIN de demo: 1234',field,[{label:'Cancelar',run:closeDialog},{label:'Entrar',primary:true,run:()=>{if(document.querySelector('#pin').value==='1234'){closeDialog();setOwner(true)}else document.querySelector('#dialog-notice').textContent='PIN incorrecto. Intenta de nuevo.'}}]);setTimeout(()=>document.querySelector('#pin')?.focus(),0)};
  document.querySelector('#exit-owner').onclick=()=>setOwner(false);
  document.querySelector('#reset-menu').onclick=()=>confirmDialog('Restablecer menú','Se recuperarán los platillos y precios originales.',()=>{data=clone(original);removed=null;persist();render();toast('Menú restablecido')},'Restablecer');
  document.querySelector('#undo').onclick=()=>{if(!removed)return;const cat=data.find(c=>c.id===removed.catId);cat.dishes.splice(Math.min(removed.index,cat.dishes.length),0,removed.dish);removed=null;persist();render();document.querySelector('#toast').classList.remove('show')};
  dialog.addEventListener('click',e=>{if(e.target===dialog)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();closeZoom()}});

  let sourceImg=null,sourceRect=null,base={left:0,top:0,width:0,height:0},scale=1,tx=0,ty=0,pointers=new Map(),gesture=null,lastTap=0,animating=false,closeRequested=false;
  function fitRect(img){const ratio=(img.naturalWidth||1)/(img.naturalHeight||1),w=Math.min(innerWidth,innerHeight*ratio),h=w/ratio;return{left:(innerWidth-w)/2,top:(innerHeight-h)/2,width:w,height:h}}
  function setZoomTransform(){zoomImg.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`}
  function openZoom(img){if(animating)return;closeRequested=false;sourceImg=img;sourceRect=img.getBoundingClientRect();zoomImg.src=img.src;zoomImg.alt=img.alt;zoom.classList.add('open');document.body.style.overflow='hidden';const end=fitRect(img);base=end;scale=1;tx=0;ty=0;zoomImg.style.transition='none';zoomImg.style.transformOrigin='top left';zoomImg.style.left=sourceRect.left+'px';zoomImg.style.top=sourceRect.top+'px';zoomImg.style.width=sourceRect.width+'px';zoomImg.style.height=sourceRect.height+'px';zoomImg.style.objectFit='cover';
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){zoomImg.style.left=end.left+'px';zoomImg.style.top=end.top+'px';zoomImg.style.width=end.width+'px';zoomImg.style.height=end.height+'px';zoomImg.style.objectFit='contain';zoomImg.style.transformOrigin='center';zoomImg.style.opacity='0';requestAnimationFrame(()=>zoomImg.style.opacity='1');return}
    animating=true;const sx=end.width/sourceRect.width,sy=end.height/sourceRect.height,dx=end.left-sourceRect.left,dy=end.top-sourceRect.top;requestAnimationFrame(()=>{zoomImg.style.transition='transform 250ms cubic-bezier(.23,1,.32,1)';zoomImg.style.transform=`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy})`;setTimeout(()=>{zoomImg.style.transition='none';zoomImg.style.transform='none';zoomImg.style.left=end.left+'px';zoomImg.style.top=end.top+'px';zoomImg.style.width=end.width+'px';zoomImg.style.height=end.height+'px';zoomImg.style.objectFit='contain';zoomImg.style.transformOrigin='center';animating=false;if(closeRequested){closeRequested=false;closeZoom()}},270)})
  }
  function closeZoom(){if(!zoom.classList.contains('open'))return;if(animating){closeRequested=true;return}if(scale>1){scale=1;tx=0;ty=0;setZoomTransform();setTimeout(closeZoom,180);return}if(!sourceImg){zoom.classList.remove('open');document.body.style.overflow='';return}animating=true;const rect=sourceImg.getBoundingClientRect();if(matchMedia('(prefers-reduced-motion: reduce)').matches){zoomImg.style.opacity='0';setTimeout(finishClose,170);return}const sx=rect.width/base.width,sy=rect.height/base.height,dx=rect.left-base.left,dy=rect.top-base.top;zoomImg.style.transformOrigin='top left';zoomImg.style.transition='transform 180ms cubic-bezier(.23,1,.32,1)';zoomImg.style.transform=`translate3d(${dx}px,${dy}px,0) scale(${sx},${sy})`;setTimeout(finishClose,190)}
  function finishClose(){zoom.classList.remove('open');document.body.style.overflow='';zoomImg.style.transition='none';zoomImg.style.transform='none';zoomImg.style.transformOrigin='center';zoomImg.style.opacity='1';animating=false;sourceImg=null}
  document.querySelector('#zoom-close').onclick=closeZoom;zoom.addEventListener('click',e=>{if(e.target===zoom)closeZoom()});addEventListener('resize',()=>{if(zoom.classList.contains('open')&&!animating){base=fitRect(zoomImg);zoomImg.style.left=base.left+'px';zoomImg.style.top=base.top+'px';zoomImg.style.width=base.width+'px';zoomImg.style.height=base.height+'px';scale=1;tx=ty=0;setZoomTransform()}});
  function bounds(nextScale){const maxX=Math.max(0,(base.width*nextScale-innerWidth)/2),maxY=Math.max(0,(base.height*nextScale-innerHeight)/2);return{x:maxX,y:maxY}}
  function rubber(value,max){if(Math.abs(value)<=max)return value;return Math.sign(value)*(max+(Math.abs(value)-max)*.22)}
  zoom.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;zoom.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()];gesture={type:'pinch',distance:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),scale,x:tx,y:ty}}else if(pointers.size===1)gesture={type:'drag',x:e.clientX,y:e.clientY,tx,ty,startY:e.clientY,time:performance.now()};
    const now=performance.now();if(pointers.size===1&&now-lastTap<300){scale=scale>1.1?1:2.5;tx=ty=0;const b=bounds(scale);tx=Math.max(-b.x,Math.min(b.x,tx));ty=Math.max(-b.y,Math.min(b.y,ty));setZoomTransform();gesture.type='double';lastTap=0}else lastTap=now
  });
  zoom.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!gesture)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&gesture.type==='pinch'){const p=[...pointers.values()],distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),next=Math.max(1,Math.min(4,gesture.scale*distance/gesture.distance));scale=next;const b=bounds(scale);tx=rubber(gesture.x,b.x);ty=rubber(gesture.y,b.y);setZoomTransform()}else if(pointers.size===1&&gesture.type==='drag'&&scale>1){const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y,b=bounds(scale);tx=rubber(gesture.tx+dx,b.x);ty=rubber(gesture.ty+dy,b.y);setZoomTransform()}});
  const pointerEnd=e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(gesture?.type==='drag'&&scale===1&&pointers.size===0&&p.y-gesture.startY>85)closeZoom();if(pointers.size===0){if(scale===1){tx=ty=0;setZoomTransform()}else{const b=bounds(scale);tx=Math.max(-b.x,Math.min(b.x,tx));ty=Math.max(-b.y,Math.min(b.y,ty));setZoomTransform()}gesture=null}else if(pointers.size===1){const remaining=[...pointers.values()][0];gesture={type:'drag',x:remaining.x,y:remaining.y,tx,ty,startY:remaining.y,time:performance.now()}}};zoom.addEventListener('pointerup',pointerEnd);zoom.addEventListener('pointercancel',pointerEnd);
  render();
})();
</script>
