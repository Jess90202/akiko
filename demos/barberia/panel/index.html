<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <title>Agenda · Barbería El Filo</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=panchang@700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0a0a0a;--surface:#151515;--card:#1c1c1c;--ink:#efefef;--muted:#a3a3a3;--line:#343434;--red:#b11226;--green:#8fd2a0;--amber:#e4c27c;--display:'Panchang',sans-serif;--text:'Switzer',sans-serif;--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--text),sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button,a{touch-action:manipulation}a{color:inherit}.demo-note{padding:9px 16px;background:var(--surface);color:var(--muted);font-size:14px;text-align:center}.app{width:min(100% - 32px,900px);margin:0 auto;padding:28px 0 60px}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px}.back{color:var(--muted);text-decoration:none}.brand{margin:0;font:700 clamp(20px,4vw,30px)/1.1 var(--display);text-transform:uppercase}.today-label{margin:8px 0 20px;color:var(--muted);text-transform:capitalize}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 22px}.stat{padding:14px;background:var(--surface);border:1px solid var(--line)}.stat strong{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:13px}.tabs,.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px}.tab,.filter,.quiet,.action,.week-day{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}.tab,.filter{padding:9px 16px;white-space:nowrap}.tab[aria-pressed=true],.filter[aria-pressed=true]{border-color:var(--red);background:var(--red)}.filters{padding-bottom:14px}.section-title{margin:14px 0 10px;font-size:18px}.agenda{display:grid;gap:9px}.appointment{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px;background:var(--surface);border:1px solid var(--line)}.appointment.next{border-left:3px solid var(--red);background:#1d1718}.appointment.blocked{opacity:.58}.time{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}.next-label{display:block;margin-top:4px;color:var(--amber);font-size:12px}.person{margin:0 0 3px;font-weight:500}.details,.price{margin:0;color:var(--muted);font-size:14px}.price{color:var(--ink);text-align:right}.status{display:inline-block;margin-top:7px;color:var(--amber);font-size:13px;text-transform:capitalize}.status.llego{color:var(--green)}.status.novino,.status.cancelada{color:#e58e8e}.actions{display:flex;flex-wrap:wrap;gap:6px;grid-column:2/-1}.action{min-height:44px;padding:8px 12px;font-size:14px}.action.primary{background:#252525}.action:active,.quiet:active,.tab:active,.filter:active{transform:scale(.97)}.empty{padding:28px 16px;background:var(--surface);color:var(--muted);text-align:center}.empty button{margin-top:12px}.week{display:grid;gap:8px}.week-day{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;text-align:left}.week-day small{color:var(--muted)}.tools{margin-top:26px;padding:18px;background:var(--surface);border:1px solid var(--line)}.tools h2{margin:0 0 14px;font-size:18px}.block-form{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}.field{display:grid;gap:5px;color:var(--muted);font-size:13px}.field input,.field select,.pin-form input{width:100%;min-height:46px;padding:9px 10px;border:1px solid #555;border-radius:0;background:var(--bg);color:var(--ink);font-size:16px}.quiet{padding:9px 14px}.reset-row{display:flex;justify-content:flex-end;margin-top:18px}.toast{position:fixed;z-index:5;right:16px;bottom:16px;max-width:min(420px,calc(100% - 32px));padding:12px 16px;background:#292929;border:1px solid #555;box-shadow:0 10px 40px #0008}.toast button{min-height:36px;margin-left:10px;border:0;background:transparent;color:#fff;text-decoration:underline;cursor:pointer}.login{display:grid;min-height:100svh;place-items:center;padding:20px}.login-card{width:min(100%,400px);padding:26px;background:var(--surface);border:1px solid var(--line)}.login-card h1{margin:0 0 8px;font:700 23px var(--display);text-transform:uppercase}.login-card p{color:var(--muted)}.pin-form{display:grid;gap:12px}.pin-form input{text-align:center;letter-spacing:.3em}.pin-form button{min-height:48px;border:0;background:var(--red);color:white;cursor:pointer}.pin-hint{margin-bottom:0;font-size:14px}.login-error{min-height:1.3em;color:#f99}.hidden{display:none!important}:focus-visible{outline:2px solid #fff;outline-offset:3px}
    @media(max-width:680px){.app{width:min(100% - 24px,900px);padding-top:20px}.block-form{grid-template-columns:1fr 1fr}.block-form .field:first-child{grid-column:1/-1}.block-form button{grid-column:1/-1}.appointment{grid-template-columns:58px minmax(0,1fr) auto;gap:8px;padding:12px}.time{font-size:18px}.actions{grid-column:1/-1}.price{font-size:13px}.stat{padding:11px}.stat strong{font-size:19px}}
    @media(max-width:360px){.stats{gap:6px}.stat{padding:9px}.stat span{font-size:12px}.tab,.filter{padding-inline:12px}.appointment{grid-template-columns:50px minmax(0,1fr)}.price{grid-column:2;text-align:left}.actions{grid-column:1/-1}}
    @media(prefers-reduced-motion:reduce){.action,.quiet,.tab,.filter{transition:none}}
  </style>
</head>
<body>
  <div id="login" class="login"><div class="login-card"><h1>Barbería El Filo</h1><p>Ingresa el PIN para ver la agenda.</p><form class="pin-form" id="pin-form"><input aria-label="PIN" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" required><button type="submit">Entrar al panel</button></form><p class="pin-hint">Pista para esta demo: 1234</p><p class="login-error" id="pin-error" aria-live="polite"></p></div></div>
  <div id="panel" class="hidden">
    <div class="demo-note">Demo · las citas se guardan solo en este dispositivo</div>
    <main class="app">
      <div class="topline"><a class="back" href="../">← Ver la página del cliente</a><span aria-hidden="true">● Agenda</span></div>
      <header><h1 class="brand">Barbería El Filo</h1><p class="today-label" id="today-label"></p></header>
      <div class="stats" id="stats"></div>
      <nav class="tabs" aria-label="Rango de agenda"><button class="tab" data-range="today" aria-pressed="true">Hoy</button><button class="tab" data-range="tomorrow" aria-pressed="false">Mañana</button><button class="tab" data-range="week" aria-pressed="false">Semana</button></nav>
      <div class="filters" aria-label="Filtrar por barbero"><button class="filter" data-barber="Todos" aria-pressed="true">Todos</button></div>
      <section id="day-view"><h2 class="section-title" id="agenda-title"></h2><div class="agenda" id="agenda"></div></section>
      <section id="week-view" class="hidden"><h2 class="section-title">Resumen de la semana</h2><div class="week" id="week-list"></div></section>
      <section class="tools"><h2>Bloquear horario</h2><form class="block-form" id="block-form"><label class="field">Barbero<select id="block-barber"></select></label><label class="field">Día<input id="block-date" type="date" required></label><label class="field">Desde<input id="block-from" type="time" step="1200" value="13:00" required></label><label class="field">Hasta<input id="block-to" type="time" step="1200" value="14:00" required></label><button class="quiet" type="submit">Guardar bloqueo</button></form></section>
      <div class="reset-row"><button class="quiet" id="reset-demo" type="button">Restablecer demo</button></div>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="../citas.js"></script>
  <script>
    (()=>{
      const api=window.CitasDemo;api.seedIfEmpty();
      const login=document.getElementById('login'),panel=document.getElementById('panel'),ranges=[...document.querySelectorAll('.tab')],filter=document.querySelector('.filters'),agenda=document.getElementById('agenda');
      let range='today',barber='Todos',selectedDate=api.today(),undoTimer,toastTimer;
      document.getElementById('pin-form').addEventListener('submit',event=>{event.preventDefault();const ok=document.getElementById('pin').value==='1234';document.getElementById('pin-error').textContent=ok?'':'PIN incorrecto. Prueba con 1234.';if(ok){login.classList.add('hidden');panel.classList.remove('hidden');render()}});
      api.barbers.forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;document.getElementById('block-barber').append(option);const btn=document.createElement('button');btn.type='button';btn.className='filter';btn.dataset.barber=name;btn.textContent=name.split(' ')[0];btn.setAttribute('aria-pressed','false');filter.append(btn)});
      document.getElementById('block-date').value=api.today();
      const money=value=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(value);
      const validCitas=date=>api.exportData().citas.filter(c=>c.fecha===date&&c.estado!=='cancelada');
      const render=()=>{const today=api.today(),tomorrow=add(today,1),citas=validCitas(today),done=citas.filter(c=>c.estado==='llego').length,total=citas.reduce((sum,c)=>sum+(api.services.find(s=>s.id===c.servicio)?.price||0),0);document.getElementById('today-label').textContent=api.dateLabel(today);document.getElementById('stats').innerHTML=`<div class="stat"><strong>${citas.length}</strong><span>citas hoy</span></div><div class="stat"><strong>${done}</strong><span>atendidas</span></div><div class="stat"><strong>${money(total)}</strong><span>estimado</span></div>`;
        ranges.forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.range===range)));document.getElementById('day-view').classList.toggle('hidden',range==='week');document.getElementById('week-view').classList.toggle('hidden',range!=='week');
        if(range==='week'){renderWeek(today);return}selectedDate=range==='today'?today:range==='tomorrow'?tomorrow:selectedDate;document.getElementById('agenda-title').textContent=api.dateLabel(selectedDate);renderDay(selectedDate)};
      const add=(date,count)=>{const d=new Date(`${date}T12:00:00Z`);d.setUTCDate(d.getUTCDate()+count);return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`};
      const renderDay=date=>{const entries=api.list(date).filter(c=>barber==='Todos'||c.barbero===barber);const now=new Date(),today=api.today(),tomorrow=add(today,1),parts=new Intl.DateTimeFormat('en-CA',{timeZone:api.zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now),current=Number(parts.find(p=>p.type==='hour').value)*60+Number(parts.find(p=>p.type==='minute').value);let nextIndex=-1;if(date===today)nextIndex=entries.findIndex(c=>c.tipo!=='bloqueo'&&c.estado==='pendiente'&&toMins(c.hora)>=current);else if(date>today)nextIndex=entries.findIndex(c=>c.tipo!=='bloqueo'&&c.estado==='pendiente');agenda.replaceChildren();if(!entries.length){agenda.innerHTML='<div class="empty">No hay citas para este día<br><button class="quiet" id="see-tomorrow">Ver mañana</button></div>';document.getElementById('see-tomorrow').addEventListener('click',()=>{range='tomorrow';render()});return}entries.forEach((item,index)=>{const block=item.tipo==='bloqueo',svc=api.services.find(s=>s.id===item.servicio),card=document.createElement('article');card.className=`appointment${index===nextIndex?' next':''}${block?' blocked':''}`;const hour=block?item.desde:item.hora;let label='';if(index===nextIndex){const remain=Math.max(0,toMins(item.hora)-current);label=date===today?`<span class="next-label">Siguiente · en ${remain<60?`${remain} min`:`${Math.floor(remain/60)} h ${remain%60} min`}</span>`:`<span class="next-label">Primera del día</span>`}card.innerHTML=`<div class="time">${hour}${label}</div><div><p class="person">${block?'Horario bloqueado':escapeHtml(item.nombre)}</p><p class="details">${block?`${item.desde}–${item.hasta}`:`${svc?.name||item.servicio} · ${escapeHtml(item.barbero)}`}</p>${block?'':`<span class="status ${item.estado}">${statusText(item.estado)}</span>`}</div><p class="price">${block?'':money(svc?.price||0)}</p>`;if(!block){const buttons=document.createElement('div');buttons.className='actions';[['llego','Llegó'],['novino','No vino'],['cancelada','Cancelar']].forEach(([status,text])=>{const b=document.createElement('button');b.type='button';b.className='action';b.textContent=text;b.disabled=item.estado===status||item.estado==='cancelada';b.addEventListener('click',()=>{if(status==='cancelada'&&!confirm(`¿Cancelar la cita de ${item.nombre}?`))return;const previous=item.estado;api.setStatus(item.id,status);render();showUndo(item.id,previous)});buttons.append(b)});const wa=document.createElement('a');wa.className='action primary';wa.textContent='WhatsApp';wa.target='_blank';wa.rel='noopener';const dayWord=date===today?'hoy':date===tomorrow?'mañana':api.dateLabel(date);wa.href=`https://wa.me/52${item.tel}?text=${encodeURIComponent(`Hola ${item.nombre}, te esperamos ${dayWord} a las ${item.hora} en Barbería El Filo`)}`;buttons.append(wa);card.append(buttons)}agenda.append(card)})};
      const renderWeek=start=>{const list=document.getElementById('week-list');list.replaceChildren();for(let i=0;i<7;i++){const date=add(start,i),entries=validCitas(date).filter(c=>barber==='Todos'||c.barbero===barber),total=entries.reduce((sum,c)=>sum+(api.services.find(s=>s.id===c.servicio)?.price||0),0),button=document.createElement('button');button.type='button';button.className='week-day';button.innerHTML=`<span>${api.dateLabel(date)}</span><small>${entries.length} citas · ${money(total)}</small>`;button.addEventListener('click',()=>{selectedDate=date;range='custom';ranges.forEach(tab=>tab.setAttribute('aria-pressed','false'));document.getElementById('week-view').classList.add('hidden');document.getElementById('day-view').classList.remove('hidden');document.getElementById('agenda-title').textContent=api.dateLabel(date);renderDay(date)});list.append(button)}};
      const statusText=value=>({pendiente:'Pendiente',llego:'Llegó',novino:'No vino',cancelada:'Cancelada'})[value]||value;const toMins=value=>Number(value.slice(0,2))*60+Number(value.slice(3));const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const showUndo=(id,previous)=>{const toast=document.getElementById('toast');toast.innerHTML='Estado actualizado <button type="button">Deshacer</button>';toast.classList.remove('hidden');toast.querySelector('button').addEventListener('click',()=>{api.setStatus(id,previous);toast.classList.add('hidden');render()},{once:true});clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hidden'),5000)};
      ranges.forEach(btn=>btn.addEventListener('click',()=>{range=btn.dataset.range;render()}));filter.addEventListener('click',event=>{if(!event.target.matches('.filter'))return;barber=event.target.dataset.barber;filter.querySelectorAll('.filter').forEach(btn=>btn.setAttribute('aria-pressed',String(btn===event.target)));render()});
      document.getElementById('block-form').addEventListener('submit',event=>{event.preventDefault();try{const date=document.getElementById('block-date').value;api.block(document.getElementById('block-barber').value,date,document.getElementById('block-from').value,document.getElementById('block-to').value);selectedDate=date;range=date===api.today()?'today':date===add(api.today(),1)?'tomorrow':'custom';render();showUndoToast('Horario bloqueado.')}catch(error){alert(error.message)}});
      const showUndoToast=message=>{const toast=document.getElementById('toast');toast.textContent=message;toast.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hidden'),3500)};
      document.getElementById('reset-demo').addEventListener('click',()=>{if(confirm('¿Restablecer citas de ejemplo y borrar los cambios de esta demo?')){api.resetDemo();render();showUndoToast('Demo restablecida.')}});
      window.addEventListener('storage',event=>{if(event.key==='elfilo-citas-v1')render()});
    })();
  </script>
</body>
</html>
